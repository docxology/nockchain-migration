<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" width="1120" height="640" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">nockchain-migration Architecture Overview</title>
  <desc id="svg-desc">Operator-gated legacy v0 to v1 P2PKH wallet migration phases, balance reconciliation in nicks, and human broadcast safety gates.</desc>
  <defs>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#475569"/></marker>
