  <text x="26.0" y="32.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#f8fafc" text-anchor="start">nockchain-migration — Operator-Gated Legacy v0 → v1 P2PKH Migration</text>
  <text x="26.0" y="54.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#cbd5e1" text-anchor="start">Executable phase state machine wrapping nockchain-wallet with mandatory human safety gates (no --yes flag)</text>
