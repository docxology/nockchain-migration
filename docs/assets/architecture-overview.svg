  <text x="588.0" y="443.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">3. Non-Bypassable Asset-Safety Invariants</text>
  <rect x="590" y="464" width="494" height="108" rx="10" fill="#0f172a" stroke="#fbbf24" stroke-width="1.3"/>
  <text x="604.0" y="484.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#fbbf24" text-anchor="start">Enforced by Code in cli.py &amp; wallet.py</text>
  <text x="604.0" y="502.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#e2e8f0" text-anchor="start">• No --yes / --force flag exists anywhere in CLI or wizard</text>
  <text x="604.0" y="518.5" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#e2e8f0" text-anchor="start">• Dual-unit parser prevents '120000 nocks 0 nicks' → 0 bug</text>
