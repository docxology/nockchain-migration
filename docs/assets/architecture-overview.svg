  <text x="408.0" y="170.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">phase_2_import_seed(version=0)</text>
  <text x="408.0" y="186.5" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">getpass hidden input (never echoed/saved)</text>
  <text x="408.0" y="203.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">Single-use del phrase memory wipe</text>
  <text x="408.0" y="219.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">Keeps v0 master active prior to keygen</text>
  <rect x="752" y="132" width="332" height="118" rx="8" fill="#f8fafc" stroke="#0d9488" stroke-width="1.3"/>
  <rect x="752" y="132" width="5" height="118" rx="2.5" fill="#0d9488"/>
