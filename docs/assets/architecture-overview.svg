  <text x="408.0" y="308.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">confirm.py: verify keys.export backed up</text>
  <text x="408.0" y="324.5" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">confirm_destination(): first-4 / last-4</text>
  <text x="408.0" y="341.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">Explicit operator y/N gate per send-tx</text>
  <text x="408.0" y="357.5" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">Appends non-secret audit to session.log</text>
  <rect x="752" y="270" width="332" height="118" rx="8" fill="#ecfdf5" stroke="#059669" stroke-width="1.3"/>
  <rect x="752" y="270" width="5" height="118" rx="2.5" fill="#059669"/>
  <text x="766.0" y="290.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" fill="#0f172a" text-anchor="start">Phase 6 — Post-Broadcast Verification</text>
  <text x="766.0" y="308.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">Polls v1 P2PKH note acceptance &amp; balance</text>
  <text x="766.0" y="324.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">Confirms zero stranded v0 spendable notes</text>
  <text x="766.0" y="341.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">Cross-checks final nocks/nicks total</text>
  <text x="766.0" y="357.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">against Phase 4 expected net output</text>
