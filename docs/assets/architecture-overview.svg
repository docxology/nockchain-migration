  <text x="50.0" y="308.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">sweep.py: migrate-v0-notes → ./txs/*.tx</text>
  <text x="50.0" y="324.5" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">parse_balance_nicks: nocks*65536 + nicks</text>
  <text x="50.0" y="341.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">reconcile(): sum(migrated) == pre − fees</text>
  <text x="50.0" y="357.5" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">Renders per-signer summary_table()</text>
