  <text x="50.0" y="502.0" font-family="ui-monospace, 'SFMono-Regular', Menlo, Monaco, Consolas, monospace" font-size="11.0" font-weight="500" fill="#334155" text-anchor="start">wallet.py  — Wrapper; refuses missing .tx / keys.export</text>
