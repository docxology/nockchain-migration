  <text x="34.0" y="109.0" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a" text-anchor="start">1. Canonical Execution Phases (scripts/migrate.py · migrate_wizard.py → cli.py)</text>
